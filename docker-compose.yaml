services:
  mysql:
    image: mysql:latest
    container_name: db_mysql_cinegaming
    environment:
      MYSQL_DATABASE: cinegaming_api
      MYSQL_USER: ${DB_USERMYSQL:-user}
      MYSQL_PASSWORD: ${DB_PASSWORDMYSQL:-root}
      MYSQL_ROOT_PASSWORD: ${DB_ROOTPASSMYSQL:-adminroot}
    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  api_backend:
    build: .
    container_name: cinegaming_api
    restart: on-failure:5
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/cinegaming_api
      - SPRING_DATASOURCE_USERNAME=${DB_USERMYSQL:-user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORDMYSQL:-root}
    depends_on:
      mysql:
        condition: service_healthy
