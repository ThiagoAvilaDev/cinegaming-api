spring.application.name=cinegamingapi

spring.datasource.url=jdbc:mysql://localhost:3306/cinegaming_api?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERMYSQL:user}
spring.datasource.password=${DB_PASSWORDMYSQL:root}

server.error.include-stacktrace=never


api.security.token.issue=${TOKEN_ISSUE:cinegaming_api}
api.security.token.secret=${TOKEN_SECRET:secret_padrao_123}


#configuration swagger
app.version=@project.version@
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.pageable-converter-enabled=true